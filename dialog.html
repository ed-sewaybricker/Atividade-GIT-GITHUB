<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Modal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: white;
      padding: 40px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }

    dialog {
      border: none;
      border-radius: 10px;
      padding: 20px;
      width: 300px;
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <button id="abrir">Abrir Modal</button>

  <dialog id="modal">
    <h2>Janela Modal</h2>
    <p>Isso foi feito apenas com HTML, CSS e JS.</p>

    <button id="fechar">Fechar</button>
  </dialog>

  <script>
    const modal = document.getElementById("modal");

    document.getElementById("abrir").onclick = () => {
      modal.showModal();
    };

    document.getElementById("fechar").onclick = () => {
      modal.close();
    };
  </script>

</body>
</html>
